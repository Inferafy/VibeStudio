[package]
name = "vibestudio"
version = "0.1.0"
description = "A local workspace for Claude Code and Codex sessions"
authors = ["Inferafy"]
edition = "2024"

[lib]
name = "vibestudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
