[package]
name = "vibestudio-m0-acp-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
agent-client-protocol = "=2.1.0"
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
dunce = "1.0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"] }
which = "8.0.0"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
